name: CI

# `merge_group` is the one that stops PRs breaking each other.
#
# A `pull_request` run tests the branch merged with the base *as it was when
# the run started*, and GitHub never recomputes it when the base moves. So two
# branches that are each green can still break main together: on 2026-09-26 one
# added a guard requiring every live tool page to render `<ToolJsonLd`, another
# added `/file/xray` without it, both were green, and main went red on the
# second merge. A merge queue re-runs these checks against the actual
# post-merge tree, which is the only place that interaction is visible.
#
# This trigger is inert until the queue is switched on in branch protection —
# but it has to land first, because a required check that never runs on
# `merge_group` stalls every merge. See CONTRIBUTING.md.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on a branch, never on main.
  #
  # A branch only cares about its latest push, so cancelling there saves CI
  # minutes and costs nothing. `main` is the opposite: every commit on it is a
  # commit somebody will build on, and a cancelled run leaves it with no
  # verdict at all.
  #
  # That is not theoretical. Measured 2026-09-26 over the last 39 CI runs on
  # main: 21 succeeded, 1 failed, and **17 were cancelled** -- 44% of commits
  # merged to main were never checked, because the next merge landed inside the
  # ~2.5 minutes a run takes and killed it.
  #
  # It has already cost a morning. #44 added a guard requiring every live tool
  # page to render ToolJsonLd; /file/xray had merged earlier in #37 without one.
  # Neither PR could see the other -- no file they both touched -- so both went
  # green and both merged. The run that would have caught it, on #44's own merge
  # commit, was CANCELLED by the next merge. Two more merges piled on before a
  # run finally completed and went red, by which point the failure looked like
  # it belonged to #50, which was innocent.
  #
  # `scripts/ci-signal.test.ts` fails if this ever goes back to an
  # unconditional true.
  # Also never cancel a merge-queue run. The queue blocks on this check, and a
  # cancelled check is not a failed one -- it leaves the entry stuck rather
  # than ejecting it, which is worse than the red build the cancel was trying
  # to save. Both conditions are needed: main's rule alone still cancels in a
  # merge_group, and the merge_group rule alone still cancels on main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'merge_group' }}


jobs:
  qc:
    name: Quality control (Node 22.x)
    runs-on: ubuntu-latest
    # `qc:release` adds the browser gate, which opens roughly a thousand pages
    # across two engines on one worker. Measured at ~21 minutes for Chromium
    # alone on two workers, so the old 30 would kill the job mid-suite and look
    # like a product failure.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      # The checked-in SBOM is npm-version specific; match the version that generated it.
      - name: Use npm 11.12.1
        run: npm install --global npm@11.12.1

      - name: Install dependencies
        run: npm ci

      # Only the two engines playwright.config.ts declares as projects.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # `pdftotext`, for e2e/pdf-ocr.spec.ts. That test reads the OCR'd PDF back
      # with a third-party extractor rather than with our own code, which is the
      # point of it — our parser agreeing with our writer would prove nothing.
      # The dependency is not new; nothing had ever run the test to need it.
      # `apt-get update` first: installing against a stale index 404s on the
      # exact .deb, which is what happened when this was written.
      - name: Install poppler-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Format check
        run: npm run format:check

      # `qc:release`, not `qc`. The eight everyday gates never open a page, so
      # nothing here could see a broken one: on 2026-09-25 the /batch rename
      # left four assertions in e2e/bench.spec.ts waiting on a heading it had
      # just deleted, and every pull request went green over it. END-TO-END and
      # DEPENDENCY ADVISORIES only exist under --release, which until now no
      # pull request ran. A gate nothing executes is not a gate.
      - name: Full QC suite, including the browser gate
        run: npm run qc:release

      # A red browser gate otherwise leaves only a log. The HTML report carries
      # the failing step, the DOM at that moment and the trace kept on retry.
      #
      # `playwright-report/` ONLY. The first run of this gate uploaded 1.63 GB
      # because it took `test-results/` as well, and the html reporter has
      # already copied every attachment it needs into the report — so the two
      # paths were the same traces twice, at a gigabyte a failing run.
      - name: Keep the Playwright report when the browser gate fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
